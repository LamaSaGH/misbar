[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "misbar"
version = "0.1.0"
description = "Reusable API monitoring and validation platform"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
    "pymongo==4.18.1",
    "python-dotenv==1.2.3",
    "tzdata==2026.4",
    "mcp[cli]==2.2.0",
    "fastapi==0.141.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-base-url==2.1.0",
    "pytest-playwright==0.9.0",
    "playwright==1.62.0",
]

[tool.setuptools.packages.find]
where = ["src"]